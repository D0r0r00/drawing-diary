spring:
  config:
    import: optional:classpath:application-local.properties
  application:
    name: drawing-diary-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:drawing_diary}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  servlet:
    multipart:
      # 이미지 업로드 상한. 이 값을 넘으면 컨테이너가 MaxUploadSizeExceededException을
      # 던지고 GlobalExceptionHandler가 413으로 바꿔준다.
      max-file-size: 10MB
      max-request-size: 11MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080
  # Railway 같은 프록시 뒤에서 X-Forwarded-* 를 반영해 원래 스킴/호스트를 복원한다.
  # 이게 없으면 업로드 응답의 이미지 URL이 http://내부주소 로 만들어져 브라우저가 막는다.
  forward-headers-strategy: framework

app:
  time-zone:
    # created_at에 적히는 벽시계의 기준. TimeZoneConfig가 JVM 기본 시간대를 이 값으로
    # 고정하므로, 바꾸면 이미 저장된 값의 해석까지 달라진다(운영 중 변경 금지).
    storage: ${APP_TIME_ZONE_STORAGE:UTC}
    # 서버가 날짜 단위로 잘라 내려주는 화면(활동 잔디)이 쓰는 기준.
    # 이것만 바꾸면 저장된 값은 그대로 두고 묶는 기준만 달라진다.
    display: ${APP_TIME_ZONE_DISPLAY:Asia/Seoul}

ai:
  server:
    # 로컬에서 AI 서버를 띄웠다면 AI_SERVER_URL=http://localhost:8000 으로 바꿔 붙는다.
    url: ${AI_SERVER_URL:https://drawing-diary.onrender.com}
    connect-timeout: 10s
    # Render 무료 티어는 유휴 상태에서 깨어나는 데만 수십 초가 걸린다(실측 52초).
    # 짧게 잡으면 첫 사용자가 항상 타임아웃을 본다.
    read-timeout: 120s

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 604800000
