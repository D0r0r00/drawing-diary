version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: drawing_diary_db
    environment:
      POSTGRES_DB: drawing_diary
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: drawing_diary_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
